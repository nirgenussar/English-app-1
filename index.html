<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body style="margin:0">
<title>אוצר מילים 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Varela+Round&display=swap">
<style>
/* Layout: fixed one-screen app, no page scroll; bottom 5% of the screen left empty for the hosting site's footer badge. Screens swap in place: start → word hub → (say | Hebrew meaning) → next word → summary */
:root{
  --bg:#EAF4EE; --card:#FFFFFF; --ink:#1B3227; --muted:#58715F; --line:#CDE1D4;
  --leaf:#23905A; --leaf-soft:#D6EEDF; --sun:#FFC53A; --sun-soft:#FFF1C9;
  --berry:#D9416B; --berry-soft:#FBE0E8; --scene:#F3F9F5; --sky:#2F6FD0; --sky-soft:#DCE8FA;
  --display:"Fredoka","Varela Round",system-ui,sans-serif;
  --body:"Varela Round","Fredoka",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1D17; --card:#172A22; --ink:#E6F2EA; --muted:#9BB6A6; --line:#2A4236;
  --leaf:#4BC283; --leaf-soft:#1E3D2E; --sun:#FFD15C; --sun-soft:#3A3218;
  --berry:#F0779A; --berry-soft:#43202C; --scene:#1C3229; --sky:#7FADF0; --sky-soft:#1C2E4A;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1D17; --card:#172A22; --ink:#E6F2EA; --muted:#9BB6A6; --line:#2A4236;
  --leaf:#4BC283; --leaf-soft:#1E3D2E; --sun:#FFD15C; --sun-soft:#3A3218;
  --berry:#F0779A; --berry-soft:#43202C; --scene:#1C3229; --sky:#7FADF0; --sky-soft:#1C2E4A;
  color-scheme:dark}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;direction:rtl;overscroll-behavior:none}
.wrap{height:100%;max-width:560px;margin:0 auto;padding-block:12px calc(5vh + 8px);padding-block-end:calc(5dvh + 8px);padding-inline:16px;display:flex;flex-direction:column;gap:10px;box-sizing:border-box}
h1,h2{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance}
button{font-family:var(--display);cursor:pointer;border:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex:none}
.top h1{font-size:1.2rem}
.count{font-family:var(--display);color:var(--muted);font-variant-numeric:tabular-nums;font-size:.95rem}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;flex:none}
.bar i{display:block;height:100%;width:0;background:var(--leaf);border-radius:99px;transition:width .4s}
main{flex:1;min-height:0;display:flex}
.copy{flex:none;text-align:center;color:var(--muted);font-size:.72rem;line-height:1;margin-top:-2px}
.namebox{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%}
.setup{gap:10px}
.setup h2.sm{font-size:1.3rem;text-align:center}
.fld{display:flex;flex-direction:column;gap:6px}
.lbl{font-family:var(--display);font-size:.95rem}
.lbl small{color:var(--muted);font-family:var(--body);font-size:.8rem}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipb{white-space:nowrap;font-family:var(--display);font-size:1.05rem;min-width:40px;padding:6px 11px;border-radius:99px;border:2px solid var(--line);background:var(--scene);color:var(--ink)}
.chipb[aria-pressed="true"]{background:var(--leaf);border-color:var(--leaf);color:#fff}
.setup .btn.big{align-self:center;padding:12px 28px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pair .chips{flex-wrap:nowrap}
.setup .namebox{align-items:stretch}
.namebox input{box-sizing:border-box}
.setup #setupMsg{color:var(--berry);text-align:center;min-height:1.2em}
.linkb{background:none;color:var(--muted);font-family:var(--body);font-size:.9rem;text-decoration:underline;padding:4px}
.names{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.names .namebox label{font-size:.95rem}
.names .namebox input{font-size:1.2rem;padding:8px 6px}
#kidNameEn{direction:ltr}
.namebox label{font-family:var(--display);font-size:1.05rem}
.namebox input{font-family:var(--display);font-size:1.4rem;text-align:center;width:100%;max-width:260px;padding:8px 12px;border-radius:14px;border:2px solid var(--line);background:var(--scene);color:var(--ink)}
.namebox input:focus{outline:none;border-color:var(--leaf)}
.screen{flex:1;min-height:0;background:var(--card);border:2px solid var(--line);border-radius:24px;padding:14px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;animation:in .25s ease-out}
@keyframes in{from{opacity:.4;transform:translateX(-14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.screen{animation:none}.bar i{transition:none}.ring.live .fg{animation:none}}
.center{justify-content:center;align-items:center;text-align:center}
.word{font-family:var(--display);font-weight:600;text-align:center;direction:ltr;letter-spacing:.03em;margin:0;line-height:1;
  flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:var(--scene);border-radius:20px;
  font-size:clamp(3.6rem,min(21vw,18vh),9rem);overflow-wrap:anywhere;padding:8px}
.wbox{position:relative;display:flex;flex:1;min-height:0}
.wbox.mini{flex:none}
.wbox .word{flex:1}
.hear{position:absolute;inset-inline-end:8px;bottom:8px;width:52px;height:52px;border-radius:50%;background:var(--card);color:var(--sky);border:2px solid var(--sky);font-size:1.5rem;display:grid;place-items:center;padding:0}
.wbox.mini .hear{top:50%;bottom:auto;transform:translateY(-50%);width:46px;height:46px;font-size:1.3rem}
.hear:disabled{opacity:.35;cursor:default}
.word.mini{flex:none;font-size:clamp(2.6rem,min(14vw,8vh),4rem);padding:10px 8px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:none}
.choice{border-radius:20px;padding:14px 8px;min-height:clamp(96px,16vh,130px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:1.2rem;font-weight:600;border:3px solid transparent}
.choice .ic{font-size:2.2rem;line-height:1}
.choice.say{background:var(--berry-soft);color:var(--berry)}
.choice.mean{background:var(--sky-soft);color:var(--sky)}
.choice.done{background:var(--leaf-soft);color:var(--leaf)}
.choice.next-up{border-color:currentColor}
.hint{color:var(--muted);text-align:center;margin:0;font-size:.95rem}
.prompt{font-size:1.1rem;margin:0;text-align:center}
.mid{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
.ring{width:clamp(110px,18vh,140px);height:clamp(110px,18vh,140px);position:relative;flex:none;display:grid;place-items:center}
.ring svg.track{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring .bg{fill:none;stroke:var(--line);stroke-width:7}
.ring .fg{fill:none;stroke:var(--berry);stroke-width:7;stroke-linecap:round;stroke-dasharray:289;stroke-dashoffset:0}
.ring.live .fg{animation:drain var(--secs) linear forwards}
@keyframes drain{from{stroke-dashoffset:0}to{stroke-dashoffset:289}}
.ring .core{width:72%;height:72%;border-radius:50%;background:var(--berry-soft);color:var(--berry);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.ring.live .core{background:var(--berry);color:#fff}
.ring.off{opacity:.4}
.ring .core svg{width:38%;height:38%}
.ring .sec{font-family:var(--display);font-weight:700;font-size:1.3rem;line-height:1;font-variant-numeric:tabular-nums}
.mid.compact #sayPrompt{display:none}
.mid.compact .ring{width:clamp(66px,11vh,90px);height:clamp(66px,11vh,90px)}
.mid.compact .ring .sec{display:none}
.line{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;max-width:320px}
.line .meter{flex:1}
.btn.sm{font-size:1rem;padding:10px 14px}
.tries{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:.9rem}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted)}
.dot.used{background:var(--muted)}
.dot.win{background:var(--leaf);border-color:var(--leaf)}
.result{width:100%;display:flex;flex-direction:column;gap:6px;align-items:center}
.meter{width:100%;max-width:300px;height:16px;border-radius:99px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;transition:width .5s}
.pct{font-family:var(--display);font-weight:700;font-size:1.5rem;line-height:1.1;font-variant-numeric:tabular-nums}
.heard{color:var(--muted);font-size:.9rem;margin:0}
.heard b{direction:ltr;unicode-bidi:isolate;font-family:var(--display)}
.msg{font-family:var(--display);font-size:1.1rem;padding:8px 14px;border-radius:14px;margin:0}
.msg.good{background:var(--leaf-soft);color:var(--leaf)}
.msg.warm{background:var(--sun-soft);color:var(--ink)}
.msg.sorry{background:var(--sky-soft);color:var(--ink)}
.opts{display:flex;flex-direction:column;gap:6px;flex:none}
.spacer{flex:1;min-height:0}
.word.mini.tight{font-size:clamp(2.2rem,min(12vw,7vh),3.4rem);padding:6px}
.opt{background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:16px;padding:6px 12px;font-size:1.25rem;font-weight:600;min-height:clamp(42px,7vh,60px)}
.opt:hover{border-color:var(--sky)}
.opt.right{background:var(--leaf);border-color:var(--leaf);color:#fff}
.opt.wrong{background:var(--berry-soft);border-color:var(--berry);color:var(--berry);text-decoration:line-through}
.opt:disabled{cursor:default}
.mres{min-height:38px;display:flex;align-items:center;justify-content:center;flex:none}
.foot{display:flex;gap:10px;justify-content:space-between;align-items:center;flex:none}
.btn{background:var(--leaf);color:#fff;font-size:1.1rem;font-weight:600;padding:12px 22px;border-radius:14px;box-shadow:0 4px 0 color-mix(in srgb,var(--leaf) 60%,#000)}
.btn.ghost{background:transparent;color:var(--leaf);box-shadow:none;border:2px solid var(--leaf)}
.btn.blue{background:var(--sky);box-shadow:0 4px 0 color-mix(in srgb,var(--sky) 60%,#000)}
.btn.big{font-size:1.3rem;padding:14px 32px}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.note{background:var(--sun-soft);border-radius:14px;padding:10px 14px;font-size:.92rem;margin:0;text-align:right}
.note.info{background:var(--sky-soft)}
.note ol{margin:6px 0 0;padding-inline-start:20px}
.faces{font-size:clamp(44px,9vh,64px);line-height:1;display:flex;gap:8px}
.hero h2{font-size:1.7rem}
.hero h2.sm{font-size:1.4rem}
.hero{gap:10px}
.ok-mic{font-family:var(--display);color:var(--leaf);font-size:1.1rem;margin:0}
.list{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;direction:ltr}
.tag{font-family:var(--display);background:var(--scene);border:2px solid var(--line);border-radius:99px;padding:2px 12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.stat{background:var(--scene);border-radius:16px;padding:10px 6px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:1.6rem;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:.82rem}
label.tog{display:flex;gap:8px;align-items:center;color:var(--muted)}
.wbox>p.word{flex:1}
.wd{white-space:nowrap;display:inline-block}
.word.phrase{font-size:clamp(2rem,min(10.5vw,7.5vh),3.6rem);line-height:1.2}
.word.phrase .wd{white-space:normal;display:block;text-align:center}
.word.phrase.mini{font-size:clamp(1.4rem,min(7.4vw,5vh),2.4rem);padding:8px 54px}
.word.phrase.mini.tight{font-size:clamp(1.2rem,min(6.2vw,4vh),2rem);padding-block:6px}
.wbox.mini .word.phrase{text-align:center}
.sg.blank{color:var(--muted)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.modes .btn{font-size:1.05rem;padding:12px 8px;line-height:1.25}
.qlabel{font-family:var(--display);color:var(--muted);text-align:center;margin:0;font-size:1rem}
.opts.tight{gap:6px}
.opts.tight .opt{min-height:clamp(38px,6.4vh,54px);font-size:1.15rem;padding:4px 10px}
@media (max-height:620px){.opts.tight .opt{min-height:36px;font-size:1.05rem}.foot .btn.big{padding:10px 22px;font-size:1.1rem}.word.phrase.mini.tight{font-size:1.15rem}.screen{gap:8px}}
.hero .list{max-height:24vh;overflow-y:auto;align-content:flex-start}
.hero .faces{font-size:clamp(36px,7vh,56px)}
.opt.en{direction:ltr;font-family:var(--display);font-size:1.2rem;font-weight:500}
.sg{border-radius:.14em;transition:background .15s,color .15s}
.sg.on{background:var(--sun);color:#1B3227}
.sg.on.v{background:var(--berry);color:#fff}
.sg.all{color:var(--leaf)}
@media (prefers-reduced-motion:reduce){.sg{transition:none}}
</style>

<div class="wrap">
  <div class="top">
    <h1 id="ttl">המילים של עופרי</h1>
    <span class="count" id="count"></span>
  </div>
  <div class="bar"><i id="bar"></i></div>
  <main id="app"></main>
  <footer class="copy">© כל הזכויות שמורות ל-<span lang="en" dir="ltr">genulogic</span></footer>
</div>

<script>
// The child's details, filled in once by an adult; every later question is built from them
let PROFILE = null;
try{ PROFILE = JSON.parse(localStorage.getItem('profile2')||'null'); }catch(_){}
let KID = 'אלוף', KID_EN = '', CITY = 'Rosh HaAyin';
const G = (m, f) => PROFILE && PROFILE.gender==='f' ? f : m;   // Hebrew wording for a boy or a girl
const cleanEn = s => { const n = (s||'').replace(/[^A-Za-z \-']/g,'').replace(/\s+/g,' ').trim().slice(0,20); return n ? n.charAt(0).toUpperCase()+n.slice(1) : ''; };
function applyProfile(){
  KID = (PROFILE && PROFILE.he) || 'אלוף';
  KID_EN = (PROFILE && PROFILE.en) || '';
  const t = document.getElementById('ttl'); if (t) t.textContent = `המילים של ${KID}`;
}
function saveProfile(pr){
  PROFILE = pr;
  try{ localStorage.setItem('profile2', JSON.stringify(pr)); }catch(_){}
  applyProfile();
}
// Each item: Hebrew meaning, 2 distractors from the list itself (list) and 2 plausible outside traps (ext).
// kind 'phrase' = a sentence; ___ marks the part the child fills in himself (fill = what to put there).
const WORDS = [
  {en:"What's your name?",   kind:'phrase', he:'מה השם שלך?',      list:['איפה את/ה גר/ה?','בן/בת כמה את/ה?'], ext:['מה שלומך?','מה זה?']},
  {en:'My name is ___.',     kind:'phrase', fill:'NAME', he:'השם שלי זה…', list:['אני גר/ה ב…','אני בן/בת …'], ext:['אני אוהב/ת…','החבר שלי זה…']},
  {en:'How old are you?',    kind:'phrase', he:'בן/בת כמה את/ה?',  list:['מה השם שלך?','איפה את/ה גר/ה?'],   ext:['מה השעה?','כמה זה עולה?']},
  {en:'I am ___ years old.', kind:'phrase', fill:'AGE', he:'אני בן/בת …', list:['השם שלי זה…','אני גר/ה ב…'], ext:['יש לי … אחים','אני בכיתה …']},
  {en:'Where do you live?',  kind:'phrase', he:'איפה את/ה גר/ה?',  list:['מה השם שלך?','בן/בת כמה את/ה?'],   ext:['לאן את/ה הולך/ת?','איפה בית הספר?']},
  {en:'I live in ___.',      kind:'phrase', fill:'CITY', he:'אני גר/ה ב…', list:['השם שלי זה…','אני בן/בת …'], ext:['אני לומד/ת ב…','אני אוהב/ת את…']},
  {en:'family',  he:'משפחה',          list:['אח','אחות'],                 ext:['חברים','סבא']},
  {en:'grade',   he:'כיתה',           list:['מורה','תלמיד/ה'],            ext:['שיעור','בית ספר']},
  {en:'sister',  he:'אחות',           list:['אח','משפחה'],                ext:['אמא','דודה']},
  {en:'brother', he:'אח',             list:['אחות','חבר/ה'],              ext:['אבא','דוד']},
  {en:'chair',   he:'כיסא',           list:['בית','ארוחת צהריים'],        ext:['שולחן','מיטה']},
  {en:'meet',    he:'לפגוש',          list:['צריך','ללמוד'],              ext:['לראות','לאכול']},
  {en:'need',    he:'צריך',           list:['לפגוש','לכתוב'],             ext:['רוצה','יכול']},
  {en:'write',   he:'לכתוב',          list:['ללמוד','לפגוש'],             ext:['לקרוא','לצייר']},
  {en:'pupil',   he:'תלמיד/ה',        list:['מורה','חבר/ה'],              ext:['ילד/ה','מנהל/ת']},
  {en:'teacher', he:'מורה',           list:['תלמיד/ה','כיתה'],            ext:['מנהל/ת','רופא/ה']},
  {en:'friend',  he:'חבר/ה',          list:['אח','תלמיד/ה'],              ext:['שכן/ה','בן דוד']},
  {en:'house',   he:'בית',            list:['כיסא','משפחה'],              ext:['חדר','רחוב']},
  {en:'lunch',   he:'ארוחת צהריים',   list:['בית','כיתה'],                ext:['ארוחת בוקר','ארוחת ערב']},
  {en:'learn',   he:'ללמוד',          list:['לכתוב','צריך'],              ext:['ללמד','לשחק']}
];
// Sounds the recognizer often writes instead of the word itself
const ALIKE = {meet:['meat'],need:['knead','kneed'],write:['right','rite','wright'],house:['hause'],grade:['grayed'],learn:['lern']};
const isPhrase = w => w && w.kind==='phrase';
const NT = () => isPhrase(cur && cur.w) ? 'המשפט' : 'המילה';
// What goes in the blank: the child's English name, the city, or (for age) his own answer
const fillWord = w => w.fill==='NAME' ? KID_EN : w.fill==='CITY' ? CITY : w.fill==='AGE' && PROFILE ? String(PROFILE.age) : '';
const fillHint = w => w.fill==='NAME' ? (KID_EN ? `<b lang="en" dir="ltr">${esc(KID_EN)}</b>` : 'השם שלך באנגלית')
                    : w.fill==='CITY' ? `<b lang="en" dir="ltr">${CITY}</b>` : w.fill==='AGE' ? (PROFILE ? `<b lang="en" dir="ltr">${PROFILE.age}</b>` : 'הגיל שלך') : '';
const speakText = w => w.en.replace(/_{2,}/g, fillWord(w) || '...');
const PASS = 70;     // passing pronunciation score
const MAX_TRIES = 3; // scored attempts per word
const MAX_MISSES = 2;// times the phone heard nothing before we blame the app, not Ofri

const CHEER_WIN = () => [`מצוין ${KID}! 🎉`,`איזו הגייה יפה, ${KID}! ⭐`,`בדיוק ככה, ${KID}! 🏆`,`כל הכבוד ${KID}! 👏`];
const CHEER_FAIL = () => [`לא נורא ${KID}! הקשבת יפה, ובפעם הבאה זה יצליח 💪`,`כל הכבוד על הניסיון, ${KID}! 🌟`,`יופי שניסית, ${KID}! ${G('תקשיב','תקשיבי')} ל${NT().slice(1)} וזה יגיע 😊`];
const SORRY = () => `כנראה יש תקלה אצלנו באפליקציה. אנחנו מתנצלים, ${KID}! אנחנו בטוחים שאמרת את ${NT()} כמו שצריך 💙`;
const pick = a => a[Math.floor(Math.random()*a.length)];

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const UA = navigator.userAgent || '';
const IN_APP = /FBAN|FBAV|Instagram|WhatsApp|Line\/|GSA\/|; wv\)|Telegram/i.test(UA);
const LOCAL = !/^https?:$/.test(location.protocol); // opened as a file (e.g. a WhatsApp attachment): mic is blocked there
const IOS = /iPhone|iPad|iPod/i.test(UA) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
const BLOCKED = IN_APP || LOCAL || !window.isSecureContext || !SR;
let micReady = false;
let order = [], idx = 0, results = [], shuffle = true, cur = null;

const app = document.getElementById('app');
const $ = id => document.getElementById(id);
const esc = s => String(s||'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
function screen(html, cls=''){ app.innerHTML = `<section class="screen ${cls}">${html}</section>`; if (typeof bindHear==='function') bindHear(); }

/* ---------- scoring ---------- */
function norm(s){return (s||'').toLowerCase().replace(/[^a-z\s]/g,' ').replace(/\s+/g,' ').trim()}
function lev(a,b){const m=a.length,n=b.length;const d=Array.from({length:m+1},(_,i)=>[i]);for(let j=1;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
function sim(a,b){if(!a||!b)return 0;return 1-lev(a,b)/Math.max(a.length,b.length)}
// Sound skeleton: consonants only, voiced/unvoiced pairs merged, so "bag"≈"back", "hen"≈"hand"
function skel(w){
  return w.replace(/ck|q/g,'k').replace(/ph/g,'f').replace(/[bp]/g,'p').replace(/[dt]/g,'t').replace(/[gkc]/g,'k')
          .replace(/[vf]/g,'f').replace(/[zs]/g,'s').replace(/(.)\1+/g,'$1').replace(/[aeiouyw]/g,'').replace(/n(t|k)$/,'n');
}
// Generous relative score: exact hit 90–100; same sound skeleton 82; otherwise by closeness, 25–85
function scoreAlts(target, alts){
  const ok = [target, ...(ALIKE[target]||[])], tk = skel(target);
  let best = 0, heard = alts[0] ? alts[0].t : '';
  for (const {t,c} of alts){
    const n = norm(t), flat = n.replace(/ /g,''), toks = n.split(' ').filter(Boolean);
    let sc;
    if (toks.some(x=>ok.includes(x)) || ok.includes(flat)){
      sc = Math.round(Math.max(90, Math.min(100, 86 + (c>0?c:.9)*14)));
    } else if (tk && (toks.some(x=>skel(x)===tk) || skel(flat)===tk)){
      sc = 82;
    } else {
      const s = Math.max(sim(target,flat), ...toks.map(x=>Math.max(sim(target,x), sim(tk,skel(x))*.9)), 0);
      sc = Math.round(Math.min(85, 25 + s*60));
    }
    if (sc > best){best = sc; heard = t}
  }
  return {score:best, heard};
}

// I'm → I am, what's → what is, so the phone's spelling and ours line up
function expand(s){ return (s||'').toLowerCase().replace(/[’']m\b/g,' am').replace(/[’']s\b/g,' is').replace(/[’']re\b/g,' are'); }
// Sentence score: every word of the sentence (except the blank) is looked for in what was heard; the child's own fill-in is free
function scorePhrase(target, alts){
  const want = norm(expand(target.replace(/_{2,}/g,' '))).split(' ').filter(Boolean);
  let best = 0, heard = alts[0] ? alts[0].t : '';
  for (const {t,c} of alts){
    const got = norm(expand(t)).split(' ').filter(Boolean);
    if (!got.length) continue;
    const parts = want.map(w => Math.max(0, ...got.map(g => g===w ? 1 : (skel(g) && skel(g)===skel(w)) ? .85 : sim(w,g)*.9)));
    const a = parts.reduce((x,y)=>x+y,0)/parts.length;
    let sc = a >= .95 ? Math.round(Math.min(100, 90 + (c>0?c:.9)*10)) : Math.round(Math.min(89, 25 + a*65));
    if (parts.some(x => x < .5)) sc = Math.min(sc, 66);   // a whole word is missing: close, but not yet a pass
    if (sc > best){ best = sc; heard = t; }
  }
  return {score:best, heard};
}
const scoreItem = (w, alts) => isPhrase(w) ? scorePhrase(w.en, alts) : scoreAlts(w.en, alts);

/* ---------- audio & microphone ---------- */
// How each word is split while it is read aloud: syllables for long words, sound chunks for short ones.
// A * marks a chunk that carries the vowel sound (highlighted in a second color); a silent e is left plain.
// Sentences are read word by word.
const SEG = {family:'*fam-*i-*ly',grade:'gr-*a-de',sister:'*sis-*ter',brother:'*broth-*er',chair:'ch-*air',meet:'m-*ee-t',
  need:'n-*ee-d',write:'wr-*i-te',pupil:'*pu-*pil',teacher:'*tea-*cher',friend:'fr-*ie-nd',house:'h-*ou-se',
  lunch:'l-*u-nch',learn:'l-*ear-n'};
function segs(w){
  if (isPhrase(w)) return w.en.split(' ').map(t=>({t, v:false, blank:/_{2,}/.test(t)}));
  return (SEG[w.en]||w.en).split('-').map(p=>({t:p.replace('*',''), v:p.startsWith('*')}));
}
const wordHTML = w => segs(w).map(p=>`<span class="sg ${p.v?'v':''} ${p.blank?'blank':''}">${esc(p.t)}</span>`).join(isPhrase(w)?' ':'');

function speakU(text, rate, onstart, onend){
  try{
    if(!window.speechSynthesis){ onend && onend(); return; }
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; u.rate = rate;
    const v = speechSynthesis.getVoices().find(v=>v.lang && v.lang.replace('_','-').startsWith('en'));
    if (v) u.voice = v;
    if (onstart) u.onstart = onstart;
    if (onend){ u.onend = onend; u.onerror = onend; }
    speechSynthesis.speak(u);
  }catch(_){ onend && onend(); }
}

// Reads the word slowly while each part lights up in turn, then says it once more with the whole word lit
let readToken = 0;
function wordSpans(){ return document.querySelectorAll('#word .sg'); }
function clearRead(){ wordSpans().forEach(s=>s.classList.remove('on','all')); }
function stopReading(){ readToken++; try{ window.speechSynthesis && speechSynthesis.cancel(); }catch(_){} clearRead(); }
function speak(){ readWord(); }
function readWord(){
  if (liveRec) return;
  stopReading();
  const ph = isPhrase(cur.w), n = segs(cur.w).length, tok = readToken, step = ph ? 480 : n>2 ? 430 : 560, txt = speakText(cur.w);
  let started = false, sweepDone = false, slowDone = false, finished = false;
  const finale = () => {
    if (tok!==readToken || finished || !sweepDone || !slowDone) return;
    finished = true;
    wordSpans().forEach(s=>{ s.classList.remove('on'); s.classList.add('all'); });
    speakU(txt, .9, null, () => setTimeout(()=>{ if (tok===readToken) clearRead(); }, 700));
  };
  const sweep = () => {
    if (started || tok!==readToken) return; started = true;
    let i = 0;
    const tick = () => {
      if (tok!==readToken) return;
      wordSpans().forEach((s,j)=>s.classList.toggle('on', j===i));
      if (++i < n) setTimeout(tick, step);
      else setTimeout(()=>{ sweepDone = true; finale(); }, step);
    };
    tick();
  };
  speakU(txt, ph ? .6 : .5, sweep, () => { slowDone = true; finale(); });
  setTimeout(sweep, 450);                                   // in case the phone never reports the start
  setTimeout(()=>{ slowDone = true; finale(); }, ph ? 5500 : 3500); // in case it never reports the end
}

// Hebrew instructions for the adult helping Ofri when the microphone is blocked

  if (IN_APP) return `<p class="note"><b>${KID}, ${G('תבקש','תבקשי')} ממבוגר עזרה:</b> האפליקציה נפתחה בתוך וואטסאפ, ושם אין מיקרופון. לוחצים על ⋮ למעלה ובוחרים "פתח ב-Chrome"${IOS?' (או ב-Safari)':''}.</p>`;

  return `<p class="note"><b>${KID}, ${G('תבקש','תבקשי')} ממבוגר עזרה:</b><ol><li>לוחצים על סמל המנעול ליד הכתובת למעלה ← הרשאות ← מיקרופון ← "אפשר".</li><li>אם אין: הגדרות הטלפון ← אפליקציות ← Chrome ← הרשאות ← מיקרופון.</li><li>לרענן את הדף.</li></ol>${reason?`<small>(${esc(reason)})</small>`:''}</p>`;
}

async function requestMic(){
  if (BLOCKED) return {ok:false};
  try{
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia){
      const st = await navigator.mediaDevices.getUserMedia({audio:true});
      st.getTracks().forEach(t=>t.stop());
    }
    return {ok:true};
  }catch(err){ return {ok:false, reason:err && err.name}; }
}

/* ---------- screens ---------- */
function shuffled(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function setProgress(){
  $('count').textContent = order.length ? `${Math.min(idx+1,order.length)} מתוך ${order.length}` : `${WORDS.length} מילים ומשפטים`;
  $('bar').style.width = order.length ? (idx/order.length*100)+'%' : '0';
}

    <div class="names">

        <div class="chips">${chip('hasBro','יש אח',pr.bro)}${chip('hasSis','יש אחות',pr.sis)}</div></div>
    </div>

  const press = (el, on) => { el.setAttribute('aria-pressed', on ? 'true' : 'false'); $('setupMsg').textContent = ''; };
  [6,7,8,9,10,11].forEach(n => $('age'+n).onclick = () => { pr.age = n; [6,7,8,9,10,11].forEach(k=>press($('age'+k), k===n)); });
  $('gm').onclick = () => { pr.gender='m'; press($('gm'),true); press($('gf'),false); };
  $('gf').onclick = () => { pr.gender='f'; press($('gf'),true); press($('gm'),false); };
  $('hasBro').onclick = () => { pr.bro = !pr.bro; press($('hasBro'), pr.bro); };
  $('hasSis').onclick = () => { pr.sis = !pr.sis; press($('hasSis'), pr.sis); };
  $('kidNameEn').onchange = ev => { ev.target.value = cleanEn(ev.target.value); };

    const missing = [!pr.he&&'שם בעברית', !pr.en&&'שם באנגלית', !pr.age&&'גיל', !pr.gender&&'ילד/ילדה'].filter(Boolean);
    if (missing.length){ $('setupMsg').textContent = 'חסר: ' + missing.join(', '); return; }

    startScreen();

function startScreen(){
  if (!PROFILE || !PROFILE.he || !PROFILE.en){ setupScreen(); return; }
  applyProfile();
  order=[]; setProgress();
  screen(`<h2 class="sm">👋 היי ${esc(KID)}! ${G('בוא','בואי')} נתרגל מילים ומשפטים באנגלית</h2>
    <div id="micbox" class="result">${BLOCKED ? micHelp() : `<p class="note info">לוחצים על הכפתור, ובחלון שקופץ בוחרים "אפשר".</p>
      <button class="btn big" id="allow">🎤 אישור מיקרופון</button>`}</div>
    <label class="tog"><input type="checkbox" id="shuf" ${shuffle?'checked':''}> לערבב את סדר המילים</label>
    <div class="modes"><button class="btn" id="go" ${micReady?'':'disabled'}>🎤 מילים ומשפטים</button><button class="btn blue" id="goQA">💬 שאלה ותשובה</button></div>
    <button class="linkb" id="editSetup">✏️ שינוי פרטים (למבוגר)</button>`, 'center hero');
  $('shuf').onchange = ev => shuffle = ev.target.checked;
  $('editSetup').onclick = setupScreen;
  if ($('allow')) $('allow').onclick = async () => {
    $('allow').disabled = true; $('allow').textContent = 'מחכים לאישור…';
    const r = await requestMic();
    if (r.ok){ micReady = true; $('micbox').innerHTML = `<p class="ok-mic">✅ המיקרופון מוכן, ${KID}!</p>`; $('go').disabled = false; $('go').focus(); }
    else { $('micbox').innerHTML = micHelp(r.reason) + `<div class="row"><button class="btn ghost sm" id="again">לנסות שוב</button><button class="btn ghost sm" id="noMic">להמשיך בלי מיקרופון</button></div>`; $('again').onclick = startScreen; $('noMic').onclick = () => { $('go').disabled = false; $('go').click(); }; }
  };
  $('goQA').onclick = qaStart;
  $('go').onclick = () => { order = shuffle ? shuffled(WORDS) : WORDS.slice(); idx = 0; results = []; newWord(); };
}

function newWord(){
  const w = order[idx];
  cur = {w, tries:0, misses:0, best:null, passed:false, glitch:false, sayDone:false, sayView:'', meaningFirst:null,
         opts: shuffled([w.he, ...w.list, ...w.ext])};
  hub();
}

// Word hub: the big word and two choices
// The word, always with a 🔊 button so Ofri can hear it at any moment (off only while the phone is listening)
function wordBox(cls){
  return `<div class="wbox ${cls.includes('mini')?'mini':''}"><p class="word ${cls} ${isPhrase(cur.w)?'phrase':''}" id="word" lang="en" aria-label="${esc(cur.w.en)}"><span class="wd">${wordHTML(cur.w)}</span></p>
    <button class="hear" id="hear" aria-label="להקשיב" ${liveRec?'disabled':''}>🔊</button></div>`;
}
function bindHear(){ if ($('hear')) $('hear').onclick = () => { if (!liveRec) readWord(); }; }

function hub(){
  stopListening(true);
  setProgress();
  const w = cur.w;
  const sayLabel = !cur.sayDone ? `להגיד את ${NT()}` : cur.glitch ? 'תקלה במיקרופון' : cur.passed ? 'אמרת נכון!' : `הקשבנו ל${NT().slice(1)}`;
  screen(`${wordBox('')}
    <p class="hint">${cur.sayDone ? `עכשיו ${G('בחר','בחרי')} מה הפירוש בעברית, ${KID}` : `מה ${G('תרצה','תרצי')} לעשות, ${KID}?`}</p>
    <div class="choices">
      <button class="choice say ${cur.sayDone?'done':''}" id="goSay" ${cur.sayDone?'disabled':''}><span class="ic">${cur.sayDone?(cur.passed?'✅':'💙'):'🎤'}</span>${sayLabel}</button>
      <button class="choice mean ${cur.sayDone?'next-up':''}" id="goMean"><span class="ic">❓</span>מה הפירוש בעברית?</button>
    </div>`);
  if (!cur.sayDone) $('goSay').onclick = sayScreen;
  $('goMean').onclick = meanScreen;
}

const MIC = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>`;
const SECS = 7; // listening window per attempt
let liveRec = null, ringTimer = null, stopTimer = null;

function dots(){
  let h='';
  for(let i=0;i<MAX_TRIES;i++) h+=`<span class="dot ${i<cur.tries?(cur.passed&&i===cur.tries-1?'win':'used'):''}"></span>`;
  return `<div class="tries" id="dots">ניסיונות: ${h}</div>`;
}

// Say screen: the 7-second ring starts on its own; between attempts Ofri is asked if he is ready
function sayScreen(){
  screen(`${wordBox('mini')}
    <div class="mid ${cur.sayView?'compact':''}" id="mid">
      <p class="prompt" id="sayPrompt">${KID}, ${G('תגיד','תגידי')} את ${NT()} באנגלית${cur.w.fill?` (במקום הקו: ${fillHint(cur.w)})`:''}</p>
      <div class="ring ${cur.sayDone?'off':''}" id="ring" style="--secs:${SECS}s" aria-label="זמן להקלטה">
        <svg class="track" viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="46"/><circle class="fg" id="fg" cx="50" cy="50" r="46"/></svg>
        <div class="core">${MIC}<span class="sec" id="sec"></span></div>
      </div>
      ${dots()}
      <div class="result" id="res">${cur.sayView}</div>
    </div>
    <div class="foot" id="foot"></div>`);
  bindRes();
  sayFoot();
  if (!cur.sayDone && !cur.started){ cur.started = true; startAttempt(); }
}

function sayFoot(){
  $('foot').innerHTML = cur.sayDone
    ? `<span></span><button class="btn blue big" id="toMean">עכשיו: הפירוש בעברית ←</button>`
    : `<button class="btn ghost" id="back">→ חזרה</button><span></span>`;
  if ($('toMean')) $('toMean').onclick = meanScreen;
  if ($('back')) $('back').onclick = () => { if (liveRec){ cur.started = false; cur.sayView = ''; } stopListening(true); hub(); };
}

function setRes(html, listening){
  cur.sayView = html;
  if ($('mid')) $('mid').classList.toggle('compact', !!html && !listening);
  if ($('res')) { $('res').innerHTML = html; bindRes(); }
}
function bindRes(){
  if ($('ready')) $('ready').onclick = startAttempt;
  if ($('again')) $('again').onclick = () => speak(cur.w.en);
}
function readyAsk(){
  return `<div class="row"><button class="btn sm" id="ready">כן, אני ${G('מוכן','מוכנה')}! 🎤</button></div>`;
}

function ringOn(){
  if ($('hear')) $('hear').disabled = true;
  const r = $('ring'); if (!r) return;
  r.classList.remove('live','off'); void r.offsetWidth; r.classList.add('live');
  let left = SECS; $('sec').textContent = left;
  clearInterval(ringTimer);
  ringTimer = setInterval(()=>{ left--; if ($('sec')) $('sec').textContent = left>0?left:''; if(left<=0) clearInterval(ringTimer); }, 1000);
}
function ringOff(){
  if ($('hear')) $('hear').disabled = false;
  clearInterval(ringTimer); clearTimeout(stopTimer);
  const r = $('ring'); if (r){ r.classList.remove('live'); if (cur.sayDone) r.classList.add('off'); }
  if ($('sec')) $('sec').textContent = '';
}
function stopListening(abort){
  ringOff();
  if (liveRec){ const r = liveRec; liveRec = null; try{ abort ? r.abort() : r.stop(); }catch(_){} }
}

function startAttempt(){
  if (cur.sayDone || liveRec || !$('ring')) return;
  stopReading();
  let rec;
  try { if (BLOCKED) throw 0; rec = new SR(); } catch(_) { miss(); return; }
  rec.lang = 'en-US'; rec.maxAlternatives = 5; rec.interimResults = false; rec.continuous = false;
  let got = false, failed = false;
  liveRec = rec;
  setRes(`<p class="msg good">מקשיבים… ${G('תגיד','תגידי')} עכשיו: <b lang="en" dir="ltr">${esc(cur.w.en)}</b></p>`, true);
  ringOn();
  stopTimer = setTimeout(()=>{ if (liveRec===rec){ try{ rec.stop(); }catch(_){} } }, SECS*1000);
  rec.onresult = ev => {
    if (got) return; got = true;
    const alts = [], r = ev.results[0];
    for (let i=0;i<r.length;i++) alts.push({t:r[i].transcript, c:r[i].confidence});
    stopListening(false);
    handleScore(scoreItem(cur.w, alts));
  };
  rec.onerror = ev => {
    if (got || ev.error==='aborted') return;
    failed = true; if (liveRec===rec) liveRec = null; ringOff();
    miss();
  };
  rec.onend = () => {
    const mine = liveRec===rec;
    if (mine) liveRec = null;
    ringOff();
    if (!got && !failed && mine) miss();
  };
  try { rec.start(); } catch(_) { liveRec = null; ringOff(); miss(); }
}

// The phone heard nothing. After MAX_MISSES it is our fault, not Ofri's: apologize and let him move on
function miss(){
  if (cur.sayDone) return;
  cur.misses++;
  if (cur.misses >= MAX_MISSES){
    cur.glitch = true;
    setRes(`<p class="msg sorry">${SORRY()}</p><p class="heard">עוברים לבחירה בעברית…</p>`);
    finishSay();
    clearTimeout(cur.autoMean);
    cur.autoMean = setTimeout(()=>{ if ($('toMean')) meanScreen(); }, 3500);
  } else {
    setRes(`<p class="msg warm">לא הצלחתי לשמוע, ${KID} 🙉 ${G('דבר','דברי')} קרוב לטלפון</p>` + readyAsk());
  }
}

function meterColor(s){return s>=PASS?'var(--leaf)':s>=50?'var(--sun)':'var(--berry)'}

function handleScore({score, heard}){
  cur.tries++;
  cur.best = Math.max(cur.best||0, score);
  const view = `<div class="line"><span class="pct" style="color:${meterColor(score)}">${score}%</span>
    <div class="meter"><i style="width:${score}%;background:${meterColor(score)}"></i></div></div>
    <p class="heard">שמעתי: <b lang="en">${esc(heard)}</b></p>`;
  if ($('dots')) $('dots').outerHTML = dots();
  if (score >= PASS){
    cur.passed = true;
    setRes(view + `<p class="msg good">${pick(CHEER_WIN())}</p>`);
    finishSay();
  } else if (cur.tries < MAX_TRIES){
    const m = score>=60 ? `כמעט ${KID}! עוד קצת ✨` : score>=45 ? `כיוון טוב ${KID}!` : `${G('בוא','בואי')} ננסה שוב, ${KID}, לאט וברור`;
    setRes(view + `<p class="msg warm">${m}<br>${G('מוכן','מוכנה')} לניסיון נוסף?</p>` + readyAsk());
  } else {
    setRes(view + `<p class="msg warm">${pick(CHEER_FAIL())}<br>${G('תקשיב','תקשיבי')} איך אומרים את ${NT()} 🔊</p>`);
    speak(cur.w.en);
    finishSay();
  }
}

function finishSay(){
  cur.sayDone = true;
  ringOff();
  if ($('dots')) $('dots').outerHTML = dots();
  if ($('sayPrompt')) $('sayPrompt').textContent = `סיימנו להגיד, ${KID}!`;
  sayFoot();
}

function meanScreen(){
  stopListening(true);
  clearTimeout(cur.autoMean);
  const w = cur.w;
  screen(`${wordBox('mini tight')}
    <p class="prompt">${KID}, מה הפירוש בעברית?</p>
    <div class="opts tight">${cur.opts.map(o=>`<button class="opt" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>
    <div class="mres" id="mres"></div>
    <div class="spacer"></div>
    <div class="foot" id="foot"><button class="btn ghost" id="back">→ חזרה</button><span></span></div>`);
  $('back').onclick = hub;
  app.querySelectorAll('.opt').forEach(b => b.onclick = () => choose(b));
}

function choose(b){
  const ok = b.dataset.v === cur.w.he;
  if (cur.meaningFirst === null) cur.meaningFirst = ok;
  if (ok){
    b.classList.add('right');
    app.querySelectorAll('.opt').forEach(x=>x.disabled=true);
    $('mres').innerHTML = `<p class="msg good">${cur.meaningFirst?`נכון ${KID}! ${pick(['👏','⭐','🎉'])}`:`נכון! הפעם הצלחת, ${KID} 👍`}</p>`;
    const last = idx === order.length-1;
    $('foot').innerHTML = `<span></span><button class="btn big" id="next">${last?'לסיכום 🏁':'הבא ←'}</button>`;
    $('next').onclick = next;
    clearTimeout(cur.timer);
    cur.timer = setTimeout(()=>{ if ($('next')) next(); }, 1800);
  } else {
    b.classList.add('wrong'); b.disabled = true;
    $('mres').innerHTML = `<p class="msg warm">לא בדיוק, ${KID}. ${G('נסה','נסי')} תשובה אחרת 🙂</p>`;
  }
}

function next(){
  clearTimeout(cur.timer);
  results.push({en:cur.w.en, say:cur.best, passed:cur.passed, glitch:cur.glitch, meaning:cur.meaningFirst});
  idx++;
  idx < order.length ? newWord() : summary();
}

function summary(){
  $('bar').style.width='100%';
  $('count').textContent = 'סיום!';
  const scored = results.filter(r=>r.say!==null);
  const avg = scored.length ? Math.round(scored.reduce((a,r)=>a+r.say,0)/scored.length)+'%' : '—';
  const passed = results.filter(r=>r.passed).length;
  const mean = results.filter(r=>r.meaning).length;
  const practice = results.filter(r=>(r.say!==null && !r.passed) || !r.meaning).map(r=>r.en);
  screen(`<div class="faces">🏆</div>
    <h2>כל הכבוד ${KID}, סיימת!</h2>
    <div class="stats">
      <div class="stat"><b>${avg}</b><span>ציון הגייה</span></div>
      <div class="stat"><b>${passed}/${results.length}</b><span>נאמרו נכון</span></div>
      <div class="stat"><b>${mean}/${results.length}</b><span>עברית נכונה</span></div>
    </div>
    ${practice.length?`<p class="prompt">כדאי לתרגל שוב:</p><div class="list">${practice.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div>`:`<p class="msg good">הכול הצליח, ${KID}! 🌟</p>`}
    <div class="row">
      ${practice.length?'<button class="btn" id="redo">לתרגל רק את אלה</button>':''}
      <button class="btn blue" id="toQA">💬 שאלה ותשובה</button>
      <button class="btn ghost" id="home">להתחלה</button>
    </div>`, 'center hero');
  $('toQA').onclick = qaStart;
  if (practice.length) $('redo').onclick = () => { order = shuffled(WORDS.filter(w=>practice.includes(w.en))); idx=0; results=[]; newWord(); };
  $('home').onclick = startScreen;
}

/* ---------- question & answer (third part of the test) ---------- */
const QA_PAIRS = () => [
  {q:"What's your name?",  a:`My name is ${KID_EN || 'Ofri'}.`},
  {q:'How old are you?',   a:`I am ${PROFILE ? PROFILE.age : 8} years old.`},
  {q:'Where do you live?', a:`I live in ${CITY}.`},
  {q:'Do you have a sister?',  a: PROFILE && PROFILE.sis ? 'Yes, I have a sister.'  : "No, I don't have a sister."},
  {q:'Do you have a brother?', a: PROFILE && PROFILE.bro ? 'Yes, I have a brother.' : "No, I don't have a brother."}
];
const QA_EXTRA_A = ['I need a chair.','I am a pupil.','I learn English.','I like lunch.'];
const QA_EXTRA_Q = ['Who is your friend?','Do you like lunch?','Who is your teacher?'];
let qa = null;

// 6 rounds: each question → pick its answer, and each answer → pick its question
function qaStart(){
  stopReading();
  const rounds = [], QA = QA_PAIRS();
  for (const p of QA){
    rounds.push({show:p.q, kind:'q', right:p.a, opts:shuffled([p.a, ...shuffled(QA.filter(x=>x!==p)).slice(0,2).map(x=>x.a), pick(QA_EXTRA_A)])});
    rounds.push({show:p.a, kind:'a', right:p.q, opts:shuffled([p.q, ...shuffled(QA.filter(x=>x!==p)).slice(0,2).map(x=>x.q), pick(QA_EXTRA_Q)])});
  }
  qa = {rounds: shuffled(rounds), i:0, first:0, misses:[]};
  qaRound();
}

function qaRound(){
  const r = qa.rounds[qa.i];
  cur = {w:{en:r.show, kind:'phrase'}};
  $('count').textContent = `${qa.i+1} מתוך ${qa.rounds.length}`;
  $('bar').style.width = (qa.i/qa.rounds.length*100)+'%';
  r.firstTry = null;
  screen(`<p class="prompt">${KID}, ${r.kind==='q'?'מה התשובה לשאלה הזו?':'מה השאלה לתשובה הזו?'}</p>
    ${wordBox('mini tight')}
    <div class="opts tight">${r.opts.map(o=>`<button class="opt en" lang="en" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>
    <div class="mres" id="mres"></div>
    <div class="spacer"></div>
    <div class="foot" id="foot"><button class="btn ghost" id="back">→ לתפריט</button><span></span></div>`);
  $('back').onclick = startScreen;
  app.querySelectorAll('.opt').forEach(b => b.onclick = () => qaChoose(b, r));
}

function qaChoose(b, r){
  const ok = b.dataset.v === r.right;
  if (r.firstTry === null){ r.firstTry = ok; if (ok) qa.first++; else qa.misses.push(r.show); }
  if (ok){
    b.classList.add('right');
    app.querySelectorAll('.opt').forEach(x=>x.disabled=true);
    $('mres').innerHTML = `<p class="msg good">${r.firstTry?`נכון ${KID}! ${pick(['👏','⭐','🎉'])}`:`נכון! הפעם הצלחת, ${KID} 👍`}</p>`;
    const last = qa.i === qa.rounds.length-1;
    $('foot').innerHTML = `<span></span><button class="btn big" id="next">${last?'לסיכום 🏁':'הבא ←'}</button>`;
    const go = () => { clearTimeout(qa.timer); qa.i++; qa.i < qa.rounds.length ? qaRound() : qaSummary(); };
    $('next').onclick = go;
    clearTimeout(qa.timer); qa.timer = setTimeout(()=>{ if ($('next')) go(); }, 1800);
  } else {
    b.classList.add('wrong'); b.disabled = true;
    $('mres').innerHTML = `<p class="msg warm">לא מתאים, ${KID}. ${G('נסה','נסי')} שוב 🙂</p>`;
  }
}

function qaSummary(){
  $('bar').style.width='100%';
  $('count').textContent = 'סיום!';
  const miss = [...new Set(qa.misses)];
  screen(`<h2>🏆 כל הכבוד ${KID}!</h2>
    <div class="stats"><div class="stat" style="grid-column:2"><b>${qa.first}/${qa.rounds.length}</b><span>נכון בניסיון ראשון</span></div></div>
    ${miss.length?`<p class="prompt">כדאי לתרגל שוב:</p><div class="list">${miss.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div>`:`<p class="msg good">כל ההתאמות הצליחו, ${KID}! 🌟</p>`}
    <div class="row">
      <button class="btn" id="again2">עוד סיבוב</button>
      <button class="btn ghost" id="home">להתחלה</button>
    </div>`, 'center hero');
  $('again2').onclick = qaStart;
  $('home').onclick = startScreen;
}

try{ if(window.speechSynthesis) speechSynthesis.getVoices(); }catch(_){}
applyProfile();
startScreen();
</script>
